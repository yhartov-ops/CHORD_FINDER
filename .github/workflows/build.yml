name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/cache@v4
        with:
          path: ci-keystore
          key: ci-keystore-v1

      - name: Create signing key (first build only)
        run: |
          if [ ! -f ci-keystore/debug.jks ]; then
            mkdir -p ci-keystore
            keytool -genkeypair -keystore ci-keystore/debug.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build
        env:
          CI_KEYSTORE: ${{ github.workspace }}/ci-keystore/debug.jks
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ChordFinder.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChordFinder build ${{ github.run_number }}
          files: ChordFinder.apk
